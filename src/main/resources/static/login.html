<!DOCTYPE html>
<html>
<head>
    <title>Login - Complaint System</title>
    <link rel="stylesheet" href="style.css">
</head>
<!-- 🔥 TAB ICON -->
    <link rel="icon" type="image/png" href="logo.png">
<body>

<div class="container">

    <div class="left-panel">
        <h1>Welcome Back!</h1>
        <p>Access your complaint dashboard</p>
    </div>

    <div class="right-panel">

        <div class="logo">
            <img src="logo.png" alt="logo">
       

        <h2>Sign In</h2>
         </div>
        <!-- ✅ ADDED id=username FOR OLD FUNCTION SUPPORT -->
        <input type="email" id="email" placeholder="Enter Email">
        <input type="hidden" id="username">  

        <input type="password" id="password" placeholder="Enter Password">

        <!-- ✅ UPDATED: call BOTH -->
        <button onclick="handleLogin()">Login</button>

        <p>Don't have account? <a href="register.html">Register</a></p>

    </div>

</div>

<script>

/* ===================== NEW COMMON HANDLER ===================== */
function handleLogin() {

    // sync username for old function
    document.getElementById("username").value =
        document.getElementById("email").value;

    // try admin/manual login first
    login();

    // then API login
    loginUser();
}
/* ============================================================= */


/* ===================== YOUR OLD FUNCTION ===================== */
function login() {

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    console.log("Checking manual admin login...");

    // 🔐 ADMIN LOGIN (ONLY YOU)
    if(username === "rajsaurav2309@gmail.com" && password === "Saurav23@"){
        console.log("Manual Admin Login Success ✅");

        localStorage.setItem("role", "admin");
        localStorage.setItem("user", username);

        window.location.href = "admin.html";

        // ✅ IMPORTANT: stop further execution
        throw new Error("Stop Execution");
    }

    console.log("Not manual admin, continue API login...");
}
/* ============================================================= */


/* ===================== YOUR MAIN FUNCTION ===================== */
function loginUser() {

    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value.trim();

    if (!email || !password) {
        alert("⚠️ Please enter email and password");
        return;
    }

    console.log("Calling API login...");
    fetch("https://janseva-14xr.onrender.com/user/login", {
   // fetch("http://localhost:8081/user/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            email: email,
            password: password
        })
    })
    .then(res => res.text())
    .then(response => {

        console.log("API Response:", response); // ✅ DEBUG

        if (response === "Login Successful") {

            // ✅ SAVE USER
            localStorage.setItem("user", email);

            /* ===================== ADDED ROLE LOGIC ===================== */

            // 🔥 MULTIPLE ADMIN SUPPORT
            const adminEmails = [
                "admin@gmail.com",
                "rajsaurav2309@gmail.com"
            ];

            if (adminEmails.includes(email)) {

                localStorage.setItem("role", "admin");
                console.log("Admin Login via API ✅");

                window.location.href = "admin.html";

            } else {

                localStorage.setItem("role", "user");
                console.log("User Login ✅");

                window.location.href = "dashboard.html";
            }

            /* ============================================================ */

        } else {
            alert("Invalid Credentials ❌");
        }
    })
    .catch(err => {
        console.error(err);
        alert("Login Failed ❌");
    });
}
/* ============================================================= */

</script>

</body>
</html>

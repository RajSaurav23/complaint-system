<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>JanSeva Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- 🔥 TAB ICON -->
    <link rel="icon" type="image/png" href="logo.png">
<style>

/* ===== BODY ===== */
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    margin: 0;
}

/* ===== HEADER ===== */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
}

/* ===== LOGO ===== */
.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo img {
    height: 45px;
}

/* ===== BUTTONS ===== */
button {
    border: none;
    padding: 8px 15px;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.3s;
}

.add-btn { background: #00c853; color: white; }
.logout-btn { background: #ff1744; color: white; }

.issue-btn {
    background: #ff9800;
    color: white;
}

button:hover { transform: scale(1.05); }

/* ===== CARDS ===== */
.cards {
    display: flex;
    gap: 20px;
    margin: 20px;
}

.card {
    flex: 1;
    padding: 20px;
    border-radius: 15px;
    color: white;
    text-align: center;
    cursor: pointer;
}

.green { background: #00c853; }
.yellow { background: #ffc400; color: black; }
.blue { background: #2979ff; }
.purple { background: #aa00ff; }

/* ===== CHARTS ===== */
.charts {
    display: flex;
    gap: 20px;
    margin: 20px;
}

canvas {
    width: 48% !important;
    height: 350px !important;
    background: white;
    border-radius: 15px;
    padding: 10px;
}

/* ===== TABLE ===== */
table {
    width: 90%;
    margin: 20px auto;
    border-collapse: collapse;
    background: white;
    border-radius: 10px;
}

th {
    background: #2a5298;
    color: white;
}

td, th {
    padding: 12px;
    text-align: center;
}

tr:hover { background: #f5f5f5; }

/* ===== BADGE ===== */
.badge {
    padding: 5px 12px;
    border-radius: 20px;
    color: white;
}

.pending { background: orange; }
.progress { background: blue; }
.resolved { background: green; }

.start-btn { background: #2979ff; color: white; }
.resolve-btn { background: #00c853; color: white; }

.hidden { display: none !important; }

</style>
</head>

<body>

<div class="header">
    <div class="logo">
        <img src="logo.png" alt="JanSeva Logo">
    </div>

    <div>
        <!-- 🔔 Notification -->
        <span id="notificationBadge" style="
            background:red;
            color:white;
            padding:5px 10px;
            border-radius:20px;
            margin-right:10px;
            display:none;
            cursor:pointer;
        ">
            🔔 0 High Priority
        </span>

        <button class="issue-btn" onclick="goToIssueDashboard()">📊 Issue Dashboard</button>
        <button class="add-btn" onclick="goToAdd()">+ Add Complaint</button>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</div>

<div class="cards">
    <div class="card green" onclick="loadByStatus('ALL')"><h2 id="total">0</h2>Total</div>
    <div class="card yellow" onclick="loadByStatus('PENDING')"><h2 id="pending">0</h2>Pending</div>
    <div class="card blue" onclick="loadByStatus('IN_PROGRESS')"><h2 id="progress">0</h2>In Progress</div>
    <div class="card purple" onclick="loadByStatus('RESOLVED')"><h2 id="resolved">0</h2>Resolved</div>
</div>

<!-- 🔥 ALERT BOX (kept but hidden permanently) -->
<div id="alertBox" style="display:none;"></div>

<!-- 🤖 AI INSIGHTS -->
<div style="margin:20px; padding:15px; background:#fff; border-radius:10px;">
    <h3>JanSeva AI Insights</h3>
    <pre id="aiInsight" style="white-space: pre-wrap;">Loading AI insights...</pre>
</div>

<div class="charts">
    <canvas id="pieChart"></canvas>
    <canvas id="barChart"></canvas>
</div>

<table>
<thead>
<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Issue</th>
    <th>Status</th>
</tr>
</thead>

<tbody id="tableData"></tbody>
</table>

<script>

let role = localStorage.getItem("role");

function goToIssueDashboard(){
    window.location.href = "issue-dashboard.html";
}

function goToAdd(){ window.location.href="new-complaint.html"; }

function logout(){
    localStorage.clear();
    window.location.href="login.html";
}

function viewComplaint(id){
    localStorage.setItem("complaintId", id);
    window.location.href = "complaint-details.html";
}

function getBadge(status){
    if(status==="PENDING") return '<span class="badge pending">Pending</span>';
    if(status==="IN_PROGRESS") return '<span class="badge progress">In Progress</span>';
    if(status==="RESOLVED") return '<span class="badge resolved">Resolved</span>';
}

async function loadByStatus(status){

    let url = "";

    if(status==="ALL"){
         url = "https://janseva-14xr.onrender.com/complaint/all";
       // url = "http://localhost:8081/complaint/all";
    } else {
            url = `https://janseva-14xr.onrender.com/api/dashboard/status/${status}`;
       // url = `http://localhost:8081/dashboard/status/${status}`;
    }

    let res = await fetch(url);
    let data = await res.json();

    renderTable(data);
}

function renderTable(list){

    let table="";

    list.forEach(c=>{
        table+=`
        <tr onclick="viewComplaint(${c.id})" style="cursor:pointer;">
            <td>${c.id}</td>
            <td>${c.name}</td>
            <td>${c.issue}</td>
            <td>${getBadge(c.status)}</td>
        </tr>`;
    });

    document.getElementById("tableData").innerHTML=table;
}

async function loadDashboard(){

    //let res = await fetch("http://localhost:8081/dashboard");
    let res = await fetch("https://janseva-14xr.onrender.com/api/dashboard");
    let data = await res.json();

    document.getElementById("total").innerText=data.total;
    document.getElementById("pending").innerText=data.pending;
    document.getElementById("progress").innerText=data.inProgress;
    document.getElementById("resolved").innerText=data.resolved;

    loadByStatus("ALL");

    new Chart(document.getElementById("pieChart"),{
        type:"pie",
        data:{
            labels:["Pending","In Progress","Resolved"],
            datasets:[{data:[data.pending,data.inProgress,data.resolved]}]
        }
    });

    new Chart(document.getElementById("barChart"),{
        type:"bar",
        data:{
            labels:["Total","Pending","In Progress","Resolved"],
            datasets:[{data:[data.total,data.pending,data.inProgress,data.resolved]}]
        }
    });
}

/* 🤖 AI */
async function loadAIInsight() {
    //let res = await fetch("http://localhost:8081/dashboard/ai-insight");
    let res = await fetch("https://janseva-14xr.onrender.com/api/dashboard/ai-insight");
    let data = await res.text();
    document.getElementById("aiInsight").innerText = data;
}

/* 🔔 NEW NOTIFICATION SYSTEM */
async function loadNotifications() {
   // let res = await fetch("http://localhost:8081/complaint/all");
    let res = await fetch("https://janseva-14xr.onrender.com/complaint/all");
    let data = await res.json();

    let high = data.filter(c => c.priority === "HIGH");

    let badge = document.getElementById("notificationBadge");

    if(high.length > 0){
        badge.style.display = "inline-block";
        badge.innerText = "🔔 " + high.length + " High Priority";

        // optional click action
        badge.onclick = () => loadByStatus("HIGH");

    } else {
        badge.style.display = "none";
    }
}

/* INIT */
loadDashboard();
loadAIInsight();
loadNotifications();

/* 🤖 CHATBOT */
function toggleChat(){
    let box = document.getElementById("chatBox");
    box.style.display = box.style.display === "none" ? "block" : "none";
}

async function sendMessage(){
    let input = document.getElementById("chatInput");
    let msg = input.value;

    let chat = document.getElementById("chatMessages");

    chat.innerHTML += `<div><b>You:</b> ${msg}</div>`;

    let res = await fetch("https://janseva-14xr.onrender.com/chatbot/ask",{
        method:"POST",
        headers:{ "Content-Type":"text/plain" },
        body: msg
    });

    let reply = await res.text();

    chat.innerHTML += `<div><b>Bot:</b> ${reply}</div>`;

    input.value="";
}

</script>

<!-- 🤖 CHAT ICON -->
<div id="chatIcon" onclick="toggleChat()" 
style="position:fixed; bottom:20px; right:20px; background:#2979ff; color:white; padding:15px; border-radius:50%; cursor:pointer;">
🤖
</div>

<!-- 🤖 CHATBOX -->
<div id="chatBox" style="
position:fixed;
bottom:80px;
right:20px;
width:300px;
background:white;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.3);
display:none;
">

<div style="padding:10px; background:#2979ff; color:white; border-radius:10px 10px 0 0;">
🤖 JanaSeva Chatbot
</div>

<div id="chatMessages" style="height:200px; overflow-y:auto; padding:10px;"></div>

<input id="chatInput" placeholder="Ask something..." style="width:100%; padding:8px;">
<button onclick="sendMessage()" style="width:100%;">Send</button>

</div>

</body>
</html>

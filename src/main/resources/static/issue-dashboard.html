<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
<title>Issue Dashboard</title>
<!-- 🔥 TAB ICON -->
    <link rel="icon" type="image/png" href="logo.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: 'Segoe UI';
    margin: 0;
    background: #f4f6f9;
}

/* ===== MENU ===== */
.menu {
    background: #1e3c72;
    padding: 15px;
    display: flex;
    justify-content: center;
    gap: 20px;
    position: relative;
}

/* BACK BUTTON */
.back-btn {
    position: absolute;
    right: 20px;
    top: 10px;
    padding: 8px 15px;
    border: none;
    border-radius: 20px;
    background: #ff5252;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.back-btn:hover {
    background: #d50000;
}

.menu button {
    padding: 10px 20px;
    border: none;
    border-radius: 20px;
    background: white;
    cursor: pointer;
    font-weight: bold;
}

.menu button:hover {
    background: #00c853;
    color: white;
}

/* ===== CONTAINER ===== */
.container {
    padding: 20px;
}

/* ===== TITLE ===== */
h2 {
    text-align: center;
}

/* ===== CHARTS ===== */
.charts {
    display: flex;
    gap: 20px;
    margin: 20px 0;
}

.chart-box {
    flex: 1;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

/* ===== TABLE ===== */
table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}

th, td {
    padding: 10px;
    border: 1px solid #ccc;
    text-align: center;
}

th {
    background: #2a5298;
    color: white;
}

/* STATUS */
.pending { color: orange; }
.progress { color: blue; }
.resolved { color: green; }

</style>
</head>

<body>

<!-- ===== MENU ===== -->
<div class="menu">

    <!-- BACK BUTTON -->
    <button class="back-btn" onclick="goBack()">⬅ Back</button>

    <button onclick="loadIssue('water')">Water Issue</button>
    <button onclick="loadIssue('electric')">Electric Issue</button>
    <button onclick="loadIssue('road')">Road Issue</button>
    <button onclick="loadIssue('garbage')">Garbage Issue</button>
</div>

<div class="container">

    <h2 id="title">Select Issue</h2>

    <!-- ===== CHARTS ===== -->
    <div class="charts">
        <div class="chart-box">
            <canvas id="pieChart"></canvas>
        </div>

        <div class="chart-box">
            <canvas id="barChart"></canvas>
        </div>
    </div>

    <!-- ===== TABLE ===== -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Issue</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

</div>

<script>

let pieChart, barChart;

function goBack(){
    window.location.href = "dashboard.html"; // change if needed
}

async function loadIssue(type){

    document.getElementById("title").innerText = type.toUpperCase() + " ISSUE";

    //let res = await fetch("http://localhost:8081/dashboard");
    let res = await fetch("https://janseva-14xr.onrender.com/dashboard");
    let data = await res.json();

    // FILTER
    let list = data.allComplaints.filter(c => 
        c.issue.toLowerCase().includes(type)
    );

    let pending=0, progress=0, resolved=0;

    list.forEach(c=>{
        if(c.status==="PENDING") pending++;
        else if(c.status==="IN_PROGRESS") progress++;
        else if(c.status==="RESOLVED") resolved++;
    });

    // ===== PIE =====
    if(pieChart) pieChart.destroy();

    pieChart = new Chart(document.getElementById("pieChart"), {
        type: 'pie',
        data: {
            labels: ['Pending','In Progress','Resolved'],
            datasets: [{
                data: [pending, progress, resolved]
            }]
        }
    });

    // ===== BAR =====
    if(barChart) barChart.destroy();

    barChart = new Chart(document.getElementById("barChart"), {
        type: 'bar',
        data: {
            labels: ['Pending','In Progress','Resolved'],
            datasets: [{
                label: 'Complaints',
                data: [pending, progress, resolved]
            }]
        }
    });

    // ===== TABLE =====
    let table="";
    list.forEach(c=>{
        table+=`
        <tr>
            <td>${c.id}</td>
            <td>${c.name}</td>
            <td>${c.issue}</td>
            <td>${c.status}</td>
        </tr>`;
    });

    document.getElementById("tableBody").innerHTML = table;
}

</script>

</body>
</html>
